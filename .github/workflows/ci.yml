name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.distribution }} / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu 24.04
            artifact: ubuntu-gcc
            image: ubuntu:24.04
            cxx: g++
            install: apt-get update && apt-get install -y --no-install-recommends build-essential python3
          - distribution: Ubuntu 24.04
            artifact: ubuntu-clang
            image: ubuntu:24.04
            cxx: clang++
            install: apt-get update && apt-get install -y --no-install-recommends build-essential clang python3
          - distribution: Debian stable
            artifact: debian-gcc
            image: debian:stable-slim
            cxx: g++
            install: apt-get update && apt-get install -y --no-install-recommends build-essential python3
          - distribution: Fedora
            artifact: fedora-gcc
            image: fedora:latest
            cxx: g++
            install: dnf install -y gcc-c++ make python3
          - distribution: Alpine Linux
            artifact: alpine-gcc
            image: alpine:latest
            cxx: g++
            install: apk add --no-cache build-base python3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and test in ${{ matrix.distribution }}
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env CXX="${{ matrix.cxx }}" \
            "${{ matrix.image }}" \
            sh -ec '
              ${{ matrix.install }}
              $CXX --version
              python3 --version
              make --version
              make -j2
              PYTHONDONTWRITEBYTECODE=1 python3 -u -m unittest discover -s tests -v
            ' 2>&1 | tee test-results.txt

      - name: Upload build and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-test-output
          path: test-results.txt
          if-no-files-found: warn
          retention-days: 14
